<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xl_AI · test6</title>
<style>
  :root {
    /* 色板：深空底 + 紫→青的“极光”强调，温柔但有性格 */
    --bg: #0a0c12;
    --surface: rgba(255,255,255,.028);
    --surface-2: rgba(255,255,255,.05);
    --surface-solid: #12151e;
    --hairline: rgba(255,255,255,.07);
    --hairline-strong: rgba(255,255,255,.12);
    --text: #edeaf6;
    --text-2: #a9a7bd;
    --text-3: #6f6d85;
    --accent-1: #9d8cff;
    --accent-2: #6fb6ff;
    --accent-3: #72e0c8;
    --grad: linear-gradient(135deg, var(--accent-1), var(--accent-2) 55%, var(--accent-3));
    --grad-soft: linear-gradient(135deg, rgba(157,140,255,.16), rgba(111,182,255,.10));
    --ok: #63e6a4;
    --warn: #ffb86b;
    --bad: #ff7b8a;
    --code-bg: rgba(0,0,0,.32);
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;

    /* emil-design-eng：自定义缓动，不用内置 ease */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);

    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 18px;
    --shadow-1: 0 1px 2px rgba(0,0,0,.35);
    --shadow-2: 0 12px 32px -12px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    position: relative;
  }
  /* 环境光：让深色底有呼吸感，而不是一块死黑 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(720px 420px at 18% -8%, rgba(157,140,255,.10), transparent 62%),
      radial-gradient(640px 380px at 92% 0%, rgba(114,224,200,.07), transparent 60%),
      radial-gradient(900px 520px at 50% 118%, rgba(111,182,255,.06), transparent 62%);
  }

  ::selection { background: rgba(157,140,255,.35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.10);
    border-radius: 5px;
    border: 3px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: rgba(255,255,255,.18); background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  #app { display: flex; height: 100%; position: relative; }

  /* ============ 主栏 ============ */
  #main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  header {
    height: 60px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 22px;
    border-bottom: 1px solid var(--hairline);
    background: rgba(10,12,18,.72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    position: relative;
    z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .orb {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--grad);
    box-shadow: 0 0 0 4px rgba(157,140,255,.12), 0 0 22px rgba(141,135,255,.38);
    position: relative;
  }
  .brand .name { font-weight: 650; font-size: 15px; letter-spacing: .01em; }
  .brand .ver { font-size: 11px; color: var(--text-3); margin-top: 1px; }

  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--hairline);
    padding: 5px 12px;
    border-radius: 999px;
  }
  .status .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-3);
    transition: background 200ms var(--ease-out);
  }
  .status.busy .dot { background: var(--accent-2); animation: breathe 1.4s var(--ease-in-out) infinite; }
  .status.work .dot { background: var(--accent-3); }
  @keyframes breathe { 50% { opacity: .35; transform: scale(.82); } }

  /* ============ 消息流 ============ */
  #msgs {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .msgs-inner {
    max-width: 880px;
    margin: 0 auto;
    padding: 26px 26px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    animation: msgIn 260ms var(--ease-out) backwards;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: none; }
  }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.bot { display: flex; justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: var(--radius-lg);
    line-height: 1.7;
    font-size: 14px;
    word-break: break-word;
  }
  .msg.user .bubble {
    color: #fff;
    background: linear-gradient(135deg, rgba(157,140,255,.95), rgba(128,150,255,.9));
    border-bottom-right-radius: 6px;
    box-shadow: 0 6px 18px -8px rgba(130,120,255,.5);
  }
  .msg.bot .bubble {
    background: var(--surface-2);
    border: 1px solid var(--hairline);
    border-bottom-left-radius: 6px;
    backdrop-filter: blur(6px);
  }

  .msg.bot .bubble.md { white-space: normal; }
  .bubble.md h1, .bubble.md h2, .bubble.md h3, .bubble.md h4 {
    margin: 12px 0 6px; line-height: 1.35;
  }
  .bubble.md h1 { font-size: 18px; } .bubble.md h2 { font-size: 16px; }
  .bubble.md h3 { font-size: 15px; } .bubble.md h4 { font-size: 14px; }
  .bubble.md p { margin: 6px 0; }
  .bubble.md ul, .bubble.md ol { margin: 6px 0; padding-left: 22px; }
  .bubble.md li { margin: 3px 0; }
  .bubble.md code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: var(--code-bg);
    padding: 1.5px 6px;
    border-radius: 5px;
  }
  .bubble.md pre {
    background: var(--code-bg);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 11px 13px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .bubble.md pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
  .bubble.md blockquote {
    margin: 8px 0; padding: 3px 13px;
    border-left: 2px solid var(--accent-1);
    color: var(--text-2);
  }
  .bubble.md a { color: var(--accent-2); text-decoration: none; }
  .bubble.md a:hover { text-decoration: underline; }
  .bubble.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .bubble.md th, .bubble.md td { border: 1px solid var(--hairline-strong); padding: 5px 11px; text-align: left; }
  .bubble.md th { background: var(--surface); }
  .bubble.md hr { border: none; border-top: 1px solid var(--hairline); margin: 11px 0; }

  /* 思考块 */
  .think {
    margin-top: 8px;
    max-width: 82%;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    background: rgba(255,255,255,.02);
    overflow: hidden;
  }
  .think summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 13px;
    color: var(--text-3);
    font-size: 12px;
    user-select: none;
    transition: color 160ms var(--ease-out);
  }
  .think summary::-webkit-details-marker { display: none; }
  .think summary:hover { color: var(--text-2); }
  .think summary .chev {
    display: inline-block;
    transition: transform 200ms var(--ease-out);
  }
  .think[open] summary .chev { transform: rotate(90deg); }
  .think pre {
    margin: 0;
    padding: 10px 14px 12px;
    color: var(--text-2);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 280px;
    overflow: auto;
    border-top: 1px solid var(--hairline);
  }

  /* ============ 工具卡片 ============ */
  .tcard {
    max-width: 88%;
    min-width: 320px;
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    background: var(--surface-2);
    overflow: hidden;
    box-shadow: var(--shadow-1);
    animation: msgIn 260ms var(--ease-out) backwards;
  }
  .tcard .thead {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 14px;
    background: rgba(255,255,255,.025);
    border-bottom: 1px solid var(--hairline);
  }
  .tcard .t-icon {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    border-radius: 6px;
    background: var(--grad-soft);
    color: var(--accent-1);
    font-size: 12px;
  }
  .tcard .t-name { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: #cfc7ff; }
  .tcard .work-tag {
    font-size: 10px;
    padding: 1.5px 7px;
    border-radius: 999px;
    background: rgba(114,224,200,.13);
    border: 1px solid rgba(114,224,200,.3);
    color: var(--accent-3);
  }
  .tcard .t-time { margin-left: auto; color: var(--text-3); font-size: 11px; }

  .tcard details { font-size: 12.5px; }
  .tcard details summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    color: var(--text-2);
    border-top: 1px solid var(--hairline);
    user-select: none;
    transition: background 160ms var(--ease-out);
  }
  .tcard details summary::-webkit-details-marker { display: none; }
  .tcard details summary:hover { background: rgba(255,255,255,.025); }
  .tcard details summary .chev {
    font-size: 9px;
    color: var(--text-3);
    transition: transform 200ms var(--ease-out);
  }
  .tcard details[open] summary .chev { transform: rotate(90deg); }
  .tcard details pre {
    margin: 0;
    padding: 10px 14px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow: auto;
    color: var(--text-2);
    background: rgba(0,0,0,.18);
  }

  .delegate {
    margin: 10px 12px 4px;
    padding: 9px 12px;
    border-radius: 9px;
    background: var(--grad-soft);
    border: 1px solid rgba(157,140,255,.28);
    color: #d7d0ff;
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .delegate .tag {
    display: inline-block;
    font-size: 10px;
    color: var(--accent-1);
    border: 1px solid rgba(157,140,255,.4);
    border-radius: 999px;
    padding: 0 7px;
    margin-right: 7px;
  }

  .err {
    border: 1px solid rgba(255,123,138,.35);
    background: rgba(255,123,138,.08);
    color: #ffb3bb;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    white-space: pre-wrap;
  }

  /* 输入中的指示 */
  .typing {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 10px 4px;
  }
  .typing .td {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-3);
    animation: tdot 1.2s var(--ease-in-out) infinite;
  }
  .typing .td:nth-child(2) { animation-delay: .16s; }
  .typing .td:nth-child(3) { animation-delay: .32s; }
  @keyframes tdot {
    0%, 60%, 100% { opacity: .3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  /* ============ 空状态 ============ */
  #empty {
    max-width: 880px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 0 26px;
    text-align: center;
  }
  #empty .hero-orb {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--grad);
    box-shadow: 0 0 0 10px rgba(157,140,255,.08), 0 0 60px rgba(141,135,255,.35);
    animation: heroGlow 5s var(--ease-in-out) infinite;
  }
  @keyframes heroGlow {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: .85; }
  }
  #empty h1 { font-size: 22px; font-weight: 650; letter-spacing: .01em; }
  #empty p { color: var(--text-2); font-size: 14px; max-width: 420px; line-height: 1.7; }
  #chips {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    justify-content: center;
    margin-top: 4px;
  }
  #chips button {
    font: inherit;
    font-size: 13px;
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--hairline-strong);
    border-radius: 999px;
    padding: 8px 15px;
    cursor: pointer;
    transition: transform 140ms var(--ease-out), border-color 160ms var(--ease-out),
                color 160ms var(--ease-out), background 160ms var(--ease-out);
  }
  @media (hover: hover) and (pointer: fine) {
    #chips button:hover {
      color: var(--text);
      border-color: rgba(157,140,255,.5);
      background: var(--grad-soft);
    }
  }
  #chips button:active { transform: scale(.96); }
  #chips button:focus-visible { outline: 2px solid var(--accent-1); outline-offset: 2px; }

  /* ============ 输入区 ============ */
  #composer-wrap {
    flex: none;
    padding: 14px 26px 18px;
    border-top: 1px solid var(--hairline);
    background: linear-gradient(to top, rgba(10,12,18,.9), rgba(10,12,18,0));
    position: relative;
    z-index: 4;
  }
  .composer {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface-solid);
    border: 1px solid var(--hairline-strong);
    border-radius: 16px;
    padding: 8px 8px 8px 16px;
    box-shadow: var(--shadow-2);
    transition: border-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
  }
  .composer:focus-within {
    border-color: rgba(157,140,255,.55);
    box-shadow: 0 12px 34px -12px rgba(0,0,0,.6), 0 0 0 3px rgba(157,140,255,.08);
  }
  .composer textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    line-height: 1.55;
    max-height: 150px;
    padding: 7px 0;
  }
  .composer textarea::placeholder { color: var(--text-3); }
  .send {
    flex: none;
    width: 38px; height: 38px;
    border: none;
    border-radius: 12px;
    background: var(--grad);
    color: #0b0d13;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 140ms var(--ease-out), opacity 160ms var(--ease-out),
                filter 160ms var(--ease-out);
    box-shadow: 0 4px 14px -5px rgba(141,135,255,.55);
  }
  @media (hover: hover) and (pointer: fine) {
    .send:hover { filter: brightness(1.08); }
  }
  .send:active { transform: scale(.93); }
  .send:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .send:focus-visible { outline: 2px solid var(--accent-3); outline-offset: 2px; }
  .send svg { width: 17px; height: 17px; }
  #hint {
    max-width: 880px;
    margin: 8px auto 0;
    color: var(--text-3);
    font-size: 11px;
    text-align: center;
  }

  /* ============ Todo 侧栏 ============ */
  #todoPanel {
    flex: none;
    width: 344px;
    border-left: 1px solid var(--hairline);
    background: rgba(12,14,21,.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    overflow-y: auto;
    padding: 20px 18px;
    display: none;
  }
  #todoPanel.show {
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: panelIn 260ms var(--ease-out);
  }
  @keyframes panelIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

  .todo-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .todo-head .clip {
    width: 30px; height: 30px;
    border-radius: 9px;
    display: grid; place-items: center;
    background: var(--grad-soft);
    color: var(--accent-1);
    flex: none;
  }
  .todo-head .tt { font-weight: 650; font-size: 14px; line-height: 1.35; word-break: break-word; }
  .badge {
    font-size: 10.5px;
    font-weight: 600;
    padding: 2.5px 9px;
    border-radius: 999px;
    letter-spacing: .02em;
  }
  .badge.undone { background: rgba(255,255,255,.07); color: var(--text-2); }
  .badge.runing { background: rgba(111,182,255,.14); color: var(--accent-2); }
  .badge.done { background: rgba(99,230,164,.13); color: var(--ok); }
  .todo-desc { color: var(--text-2); font-size: 12.5px; line-height: 1.6; }

  .progress { display: flex; align-items: center; gap: 11px; }
  .progress .track {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,.07);
    border-radius: 3px;
    overflow: hidden;
  }
  /* 用 transform: scaleX 而不是 width，动画走 GPU */
  .progress .bar {
    height: 100%;
    border-radius: 3px;
    background: var(--grad);
    transform-origin: left center;
    transform: scaleX(0);
    transition: transform 500ms var(--ease-out);
  }
  .progress .pct { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }

  .sec-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  #todoTasks { list-style: none; display: flex; flex-direction: column; gap: 7px; }
  #todoTasks li {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 9px 11px;
    border: 1px solid var(--hairline);
    border-radius: 11px;
    background: var(--surface);
    font-size: 13px;
    line-height: 1.45;
    transition: border-color 200ms var(--ease-out), background 200ms var(--ease-out);
    animation: taskIn 280ms var(--ease-out) backwards;
  }
  @keyframes taskIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  #todoTasks li.current {
    border-color: rgba(111,182,255,.55);
    background: rgba(111,182,255,.06);
  }
  .task-ic {
    width: 20px; height: 20px;
    flex: none;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 10px;
    margin-top: 1px;
    border: 1px solid rgba(255,255,255,.14);
    color: var(--text-3);
  }
  #todoTasks li.done .task-ic {
    background: rgba(99,230,164,.14);
    border-color: transparent;
    color: var(--ok);
  }
  #todoTasks li.current .task-ic {
    background: rgba(111,182,255,.15);
    border-color: transparent;
    color: var(--accent-2);
    animation: currentPulse 1.8s var(--ease-in-out) infinite;
  }
  @keyframes currentPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(111,182,255,.0); }
    50% { box-shadow: 0 0 0 4px rgba(111,182,255,.12); }
  }
  #todoTasks li.failed .task-ic { background: rgba(255,123,138,.14); border-color: transparent; color: var(--bad); }
  #todoTasks li .t { flex: 1; }
  #todoTasks li .t .title { display: block; transition: color 200ms var(--ease-out); }
  #todoTasks li.done .t .title { color: var(--text-3); text-decoration: line-through; }
  #todoTasks li .t .c { color: var(--text-3); font-size: 11.5px; display: block; margin-top: 2px; line-height: 1.5; }
  #todoTasks li .st {
    font-size: 10px;
    align-self: center;
    color: var(--text-3);
    flex: none;
  }

  #todoNotes { display: flex; flex-direction: column; gap: 6px; }
  #todoNotes .note {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    padding: 7px 10px;
    color: var(--text-2);
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    animation: taskIn 280ms var(--ease-out) backwards;
  }
  #todoNotes .empty { color: var(--text-3); font-size: 12px; padding: 2px 0; }

  /* 窄屏：侧栏变抽屉式覆盖 */
  @media (max-width: 960px) {
    #todoPanel {
      position: fixed;
      inset: 60px 0 0 auto;
      height: calc(100% - 60px);
      width: min(360px, 92vw);
      box-shadow: -24px 0 60px rgba(0,0,0,.5);
      z-index: 20;
    }
    #todoPanel.show { animation: drawerIn 280ms var(--ease-out); }
    @keyframes drawerIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: none; } }
  }

  /* 动效克制：尊重系统减弱动效 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
    #todoPanel.show { animation: none; }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="main">
      <header>
        <div class="brand">
          <div class="orb"></div>
          <div>
            <div class="name">Xl_AI</div>
            <div class="ver">test6 · 尚未命名</div>
          </div>
        </div>
        <div class="status" id="status">
          <span class="dot"></span>
          <span id="statusText">空闲</span>
        </div>
      </header>

      <div id="msgs">
        <div id="empty">
          <div class="hero-orb"></div>
          <h1>它在等你开口</h1>
          <p>test6 还没有名字——它沿袭着为自己命名的传统。
             如果你好奇，聊着聊着可以问问它想叫什么。</p>
          <div id="chips">
            <button data-c="建一个包含三个简单任务的 todo 并启动它">体验 todo 全流程</button>
            <button data-c="调用 test_t 工具试几次">试试工具调用</button>
            <button data-c="如果让你给自己取名字，你想叫什么？">问问它的名字</button>
          </div>
        </div>
        <div class="msgs-inner" id="msgsInner"></div>
      </div>

      <div id="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="和它说点什么…（Shift+Enter 换行）"></textarea>
          <button class="send" id="send" aria-label="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </div>
        <div id="hint">Enter 发送 · Shift+Enter 换行</div>
      </div>
    </div>

    <aside id="todoPanel">
      <div class="todo-head">
        <div class="clip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 4v16M4 10h5"/></svg>
        </div>
        <span class="tt" id="todoTitle"></span>
        <span class="badge" id="todoBadge"></span>
      </div>
      <div class="todo-desc" id="todoDesc"></div>
      <div class="progress">
        <div class="track"><div class="bar" id="todoBar"></div></div>
        <span class="pct" id="todoPct"></span>
      </div>
      <div>
        <div class="sec-title">任务</div>
        <ul id="todoTasks"></ul>
      </div>
      <div>
        <div class="sec-title">任务记录</div>
        <div id="todoNotes"></div>
      </div>
    </aside>
  </div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const msgsInner = $("msgsInner");
const input = $("input");
const sendBtn = $("send");
let streaming = false;

const TASK_META = {
  done:    { icon: "✓", label: "已完成" },
  runing:  { icon: "▶", label: "执行中" },
  failed:  { icon: "✗", label: "失败" },
  pending: { icon: "○", label: "待办" },
};
const TODO_LABEL = { done: "已完成", runing: "执行中", undone: "未开始" };

function md2html(text) {
  if (typeof marked === "undefined" || typeof DOMPurify === "undefined") return null;
  const raw = marked.parse(text, { breaks: true, gfm: true });
  return DOMPurify.sanitize(raw);
}

function nearBottom() {
  const m = $("msgs");
  return m.scrollHeight - m.scrollTop - m.clientHeight < 140;
}
function scrollBottom() {
  const m = $("msgs");
  if (nearBottom()) m.scrollTop = m.scrollHeight;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function addMsg(cls) {
  if ($("empty")) $("empty").remove();
  const wrap = el("div", "msg " + cls);
  msgsInner.appendChild(wrap);
  scrollBottom();
  return wrap;
}

function addUser(text) {
  const wrap = addMsg("user");
  wrap.appendChild(el("div", "bubble", text));
}

function addBot(content, think) {
  const hasContent = content && content.trim();
  const hasThink = think && think.trim();
  if (!hasContent && !hasThink) return;
  const wrap = addMsg("bot");
  if (hasContent) {
    const bubble = el("div", "bubble md");
    const html = md2html(content);
    if (html) bubble.innerHTML = html;
    else bubble.textContent = content;
    wrap.appendChild(bubble);
  }
  if (hasThink) {
    const det = el("details", "think");
    const sum = el("summary");
    sum.appendChild(el("span", "chev", "›"));
    sum.appendChild(document.createTextNode("思考过程"));
    det.appendChild(sum);
    det.appendChild(el("pre", null, think));
    wrap.appendChild(det);
  }
}

function chevron() { return el("span", "chev", "›"); }

function addTool(ev) {
  const wrap = addMsg("bot");
  const card = el("div", "tcard");

  const head = el("div", "thead");
  head.appendChild(el("span", "t-icon", "⚙"));
  head.appendChild(el("span", "t-name", ev.name));
  if (ev.is_work) head.appendChild(el("span", "work-tag", "work"));
  if (ev.time) head.appendChild(el("span", "t-time", ev.time));
  card.appendChild(head);

  if (ev.prompt) {
    const d = el("div", "delegate");
    d.appendChild(el("span", "tag", "委派"));
    d.appendChild(document.createTextNode(ev.prompt));
    card.appendChild(d);
  }

  const argsTxt = JSON.stringify(ev.args ?? {}, null, 2);
  const argsDet = el("details");
  const as = el("summary");
  as.appendChild(chevron()); as.appendChild(document.createTextNode("参数"));
  argsDet.appendChild(as);
  argsDet.appendChild(el("pre", null, argsTxt));
  card.appendChild(argsDet);

  const resTxt = ev.res ?? "(空)";
  const resDet = el("details");
  resDet.open = String(resTxt).length < 500;
  const rs = el("summary");
  rs.appendChild(chevron()); rs.appendChild(document.createTextNode("结果"));
  resDet.appendChild(rs);
  resDet.appendChild(el("pre", null, resTxt));
  card.appendChild(resDet);

  wrap.appendChild(card);
}

function addError(msg) {
  const wrap = addMsg("bot");
  wrap.appendChild(el("div", "err", "⚠ " + msg));
}

function setStatus(text, kind) {
  $("statusText").textContent = text;
  $("status").className = "status" + (kind ? " " + kind : "");
}

/* ---------- Todo 渲染 ---------- */
function renderTodo(todo) {
  const panel = $("todoPanel");
  panel.classList.add("show");
  $("todoTitle").textContent = todo.title || ("#" + todo.id);
  const badge = $("todoBadge");
  badge.textContent = TODO_LABEL[todo.status] || todo.status;
  badge.className = "badge " + (todo.status || "undone");
  $("todoDesc").textContent = todo.description || "";

  const total = todo.tasks.length;
  const done = todo.tasks.filter(t => t.status === "done").length;
  const pct = total ? done / total : 0;
  $("todoBar").style.transform = "scaleX(" + pct + ")";
  $("todoPct").textContent = done + "/" + total;

  const ul = $("todoTasks");
  ul.innerHTML = "";
  todo.tasks.forEach((t, i) => {
    const meta = TASK_META[t.status] || TASK_META.pending;
    const li = el("li", t.status);
    li.style.animationDelay = (i * 45) + "ms";
    if (t.id === todo.running_id && todo.status === "runing") li.classList.add("current");
    li.appendChild(el("span", "task-ic", meta.icon));
    const box = el("div", "t");
    box.appendChild(el("span", "title", t.title));
    if (t.content) box.appendChild(el("span", "c", t.content));
    li.appendChild(box);
    li.appendChild(el("span", "st", meta.label));
    ul.appendChild(li);
  });

  const notes = $("todoNotes");
  notes.innerHTML = "";
  const list = todo.notes || [];
  if (!list.length) {
    notes.appendChild(el("div", "empty", "还没有记录，等第一个任务完成后会出现在这里"));
  } else {
    list.forEach((n, i) => {
      const note = el("div", "note", n);
      note.style.animationDelay = (i * 45) + "ms";
      notes.appendChild(note);
    });
  }
}

/* ---------- 流式请求 ---------- */
async function sendMessage(text) {
  streaming = true;
  sendBtn.disabled = true;
  input.disabled = true;
  addUser(text);
  setStatus("思考中", "busy");
  const typing = el("div", "msg bot");
  const tdWrap = el("div", "typing");
  tdWrap.appendChild(el("i", "td")); tdWrap.appendChild(el("i", "td")); tdWrap.appendChild(el("i", "td"));
  typing.appendChild(tdWrap);
  msgsInner.appendChild(typing);
  scrollBottom();

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (typing.parentNode) typing.remove();
        handleEvent(ev);
      }
    }
  } catch (e) {
    if (typing.parentNode) typing.remove();
    addError(String(e));
  } finally {
    streaming = false;
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
    setStatus("空闲", "");
  }
}

function handleEvent(ev) {
  switch (ev.type) {
    case "bot":
      addBot(ev.content, ev.think);
      break;
    case "tool":
      addTool(ev);
      setStatus("工具: " + ev.name, "work");
      break;
    case "todo":
      renderTodo(ev.todo);
      break;
    case "error":
      addError(ev.message);
      break;
  }
  scrollBottom();
}

/* ---------- 交互 ---------- */
function submit() {
  const text = input.value.trim();
  if (!text || streaming) return;
  input.value = "";
  input.style.height = "auto";
  sendMessage(text);
}

sendBtn.addEventListener("click", submit);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 150) + "px";
});
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-c]");
  if (b) { input.value = b.dataset.c; submit(); }
});

input.focus();
</script>
</body>
</html>
