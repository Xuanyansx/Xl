<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="button" value="随机给5次分" onclick="g()">
    <script>
        let b = 0;
        function g(){
            for (let i = 0;i<=4;i++){
                let a = Math.ceil(Math.random()*10);
                b+=a;
                console.log(a);
            }
            alert(b/5);
            
        }
    </script>
</body>
</html>
