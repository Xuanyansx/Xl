
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        p {
            margin: 0;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td onclick="qh(1)">
                <p>点卡</p>
                <div id="dk">
                    <p>游戏<input type="text"></p>
                    <p>面值<input type="text"></p>
                </div>
            </td>
            <td onclick="qh(0)">
                <p>手机</p>
                <div hidden="true" id="sj">
                    <p>手机游戏<input type="text"></p>
                    <p>面值<input type="text"></p>
                </div>
            </td>
        </tr>
    </table>    
    <script>
        function qh(bool){
            let dk = document.getElementById("dk");
            let sj = document.getElementById("sj");
            if(!bool){
                dk.hidden = true;
                sj.hidden = false;
            }
            else{
                dk.hidden = false;
                sj.hidden = true;
            }
        }
    </script>
</body>
</html>
