<body>
    <script>
        let b = 0;
        let sum = [];
        for (let i = 1; i < 6; i++) {
            for (let o = 0; o < 5; o++) {
                b += parseInt(prompt(`${i}的成绩`));
            }
            console.log(`第${i}位同学的平均成绩是${ b / 5 }`);
            sum[i] = b/5
            b = 0;
        }
        sum = sum.sort(function(a, b){return a - b}); 
        console.log(sum[4])
        
    </script>
</body>
